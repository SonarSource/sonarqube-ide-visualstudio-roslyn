---
name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Full version including build number, e.g. 1.2.3.456'
        required: true

env:
  PYTHONUNBUFFERED: 1

jobs:
  release:
    permissions:
      id-token: write
      contents: write
    uses: SonarSource/gh-action_release/.github/workflows/main.yaml@68cce06d8dd558c28b4497af7c155dae91673fe1 # 7.7.0
    with:
      version: ${{ inputs.version }}
      slackChannel: C02E6L5C01H # squad-devex-private
