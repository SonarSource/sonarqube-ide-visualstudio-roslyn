---
name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Full version including build number, e.g. 1.2.3.456'
        required: true

env:
  PYTHONUNBUFFERED: 1

jobs:
  release:
    permissions:
      id-token: write
      contents: write
    uses: SonarSource/gh-action_release/.github/workflows/main.yaml@dfd7769f7126d48787f809d3aa54facc942c86f2 # 7.10.2
    with:
      version: ${{ inputs.version }}
      slackChannel: C02E6L5C01H # squad-devex-private
